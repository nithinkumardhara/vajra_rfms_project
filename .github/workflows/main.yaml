name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Listener
        working-directory: ./VJ_RLY_RFMS_Listener
        run: mvn clean package -DskipTests

      - name: Build Rest APIs
        working-directory: ./VJ_RLY_RFMS_REST_APIs
        run: mvn clean package -DskipTests

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Listener image
        uses: docker/build-push-action@v6
        with:
          context: ./VJ_RLY_RFMS_Listener
          push: true
          tags: nithinvajra/listener:1

      - name: Build RestAPIs image
        uses: docker/build-push-action@v6
        with:
          context: ./VJ_RLY_RFMS_REST_APIs
          push: true
          tags: nithinvajra/restapi:1