server:
  port: 8889

spring:
  application:
    name: VJ_RLY_RFMS_REST_APIs

  profiles:
    active: prod

  # Redis Configuration
  redis:
    host: 192.168.1.14   # localhost
    port: 6379
    timeout: 60000ms

  cache:
    type: redis
    redis:
      time-to-live: 1800000 # 30 minutes default

  # Jackson Configuration (for JSON serialization)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
